<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cue - Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --card: #ffffff;
        --fg: #1f2329;
        --muted: #6b7280;
        --border: #e3e3e6;
        --accent: #1a1a1a;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f1f;
          --card: #2a2a2a;
          --fg: #ececf1;
          --muted: #9a9aa6;
          --border: #3a3a3a;
          --accent: #ececf1;
          --on-accent: #1a1a1a;
        }
      }
      * { box-sizing: border-box; }
      html, body { width: 320px; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { width: 100%; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: var(--muted); margin: 0 0 16px; font-size: 12px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field + .field { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
      label.title { font-weight: 600; }
      .hint { color: var(--muted); font-size: 12.5px; }
      .row { display: flex; align-items: center; gap: 10px; }
      input[type="number"] {
        width: 110px;
        padding: 7px 9px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
      .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
      input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
      .actions { margin-top: 22px; display: flex; align-items: center; gap: 12px; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        background: var(--accent);
        color: var(--on-accent);
      }
      button.secondary { background: transparent; color: var(--fg); border-color: var(--border); }
      button:active { transform: translateY(1px); }
      .saved { color: var(--accent); font-size: 13px; opacity: 0; transition: opacity 0.15s; }
      .saved.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Cue</h1>
      <p class="sub">Prompt Queue for ChatGPT · Settings</p>

      <div class="card">
        <div class="field">
          <label class="title" for="delay">Auto-send delay</label>
          <p class="hint">
            How long to wait after a response finishes before sending the next
            queued prompt.
          </p>
          <div class="row">
            <input id="delay" type="number" min="0" max="60" step="0.1" />
            <span class="hint">seconds</span>
          </div>
        </div>

        <div class="field">
          <label class="switch">
            <input id="startPaused" type="checkbox" />
            <span class="title">Start paused</span>
          </label>
          <p class="hint">
            Open every ChatGPT tab with auto-send paused, so prompts only send
            once you press play.
          </p>
        </div>
      </div>

      <div class="actions">
        <button id="save" type="button">Save</button>
        <button id="reset" type="button" class="secondary">Reset to defaults</button>
        <span id="saved" class="saved">Saved ✓</span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
